name: Build and Release Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconsole --onefile --name RevoplaktScraper gui.py

      - name: Verify Executable Exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/RevoplaktScraper.exe")) {
            Write-Error "Executable was not generated in dist/RevoplaktScraper.exe"
            exit 1
          }
          $item = Get-Item "dist/RevoplaktScraper.exe"
          Write-Host "Built: $($item.FullName) ($([math]::Round($item.Length / 1MB, 2)) MB)"

      - name: Generate Release Tag & Notes
        id: vars
        shell: pwsh
        run: |
          $tag = "v1.2.$($env:GITHUB_RUN_NUMBER)"
          $commitMsg = git log -1 --pretty=%B
          $shortSha = git rev-parse --short HEAD
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "commit_msg=$commitMsg" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }} (${{ steps.vars.outputs.short_sha }})
          body: |
            ### Automated Build Release
            - **Commit:** `${{ steps.vars.outputs.short_sha }}`
            - **Summary:** ${{ steps.vars.outputs.commit_msg }}
            - **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            #### Download
            Download `RevoplaktScraper.exe` below and double-click to launch the GUI directly on Windows.
          files: dist/RevoplaktScraper.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
